# MeshCore LoRa OTA hardware lab inventory.
#
# Roles are pinned to USB serial numbers so that ttyACM renumbering never
# changes which physical board is the uploader and which is the update target.
# Override a role without editing this file by exporting
# MESHCORE_LAB_<ROLE>_SERIAL, e.g. MESHCORE_LAB_TARGET_SERIAL=ABC123.
#
# `make lab-devices` prints every attached board and the role it resolves to.

[roles]
# Uploader / OTA initiator.
client = 4186AE911D94CDB1
# Remote node being updated over LoRa.
target = 49C5BAF21EEF44A1
